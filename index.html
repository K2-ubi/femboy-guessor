<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEMBOY GUESSOR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b14;
            color: #f5efff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 480px;
        }
        .icon {
            font-size: 72px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #FFDEE9, #FFB5C8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1rem;
            color: #c9c3f0;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .footer {
            font-size: 0.8rem;
            color: #5a5270;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <h1>Мы подверглись атаке</h1>
        <p>К сожалению, сайт временно недоступен.<br>Ведутся технические работы.</p>
        <p>Приносим извинения за неудобства.</p>
        <div class="footer">FEMBOY GUESSOR</div>
    </div>
</body>
</html>
